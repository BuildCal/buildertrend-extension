services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bt_user
      POSTGRES_PASSWORD: bt_dev_password
      POSTGRES_DB: bt_tools_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bt_user -d bt_tools_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
